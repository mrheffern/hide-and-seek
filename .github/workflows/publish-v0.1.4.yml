name: Publish Out of Sight v0.1.4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify the Android APK
        env:
          STAGING_URL: https://out-of-sight-v014-staging.pages.dev
          APK_SHA256: adff0f9a532ac1ff7d51bae75032de0816e59e07fe626efad73c7665ada054a4
        run: |
          for part in 00 01 02 03 04; do
            curl --fail --location --retry 5 --retry-all-errors \
              "$STAGING_URL/apk.part.$part" \
              --output "$RUNNER_TEMP/apk.part.$part"
          done
          cp "$RUNNER_TEMP/apk.part.00" "$RUNNER_TEMP/out-of-sight-v0.1.4.apk"
          for part in 01 02 03 04; do
            dd if="$RUNNER_TEMP/apk.part.$part" of="$RUNNER_TEMP/out-of-sight-v0.1.4.apk" \
              oflag=append conv=notrunc status=none
          done
          echo "$APK_SHA256  $RUNNER_TEMP/out-of-sight-v0.1.4.apk" | sha256sum --check --strict

      - name: Publish the GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Android internal beta prerelease.

            - Adds server-authoritative automatic tags after one continuous second of precise proximity inside the 20-foot radius.
            - Adds private Hidden Mode after four continuously observed stationary seconds, including the hiding countdown.
            - Hidden Mode blocks automatic tags only; the seeker can still use TAG after physically discovering a stationary hider.
            - Hidden Mode exits only after one second of reliable movement based on native speed or accuracy-adjusted displacement.
            - Diagnostics distinguish automatic tags from manual TAG outcomes.

            Version 0.1.4 uses game protocol 2. Update every phone before testing, then create a new party; older beta builds cannot join a protocol-2 party.

            This remains a field-test build. Automatic tags and Hidden Mode require open-sky and near-building physical validation before competitive play.
        run: |
          if gh release view v0.1.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.1.4 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v0.1.4 "$RUNNER_TEMP/out-of-sight-v0.1.4.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Out of Sight v0.1.4" \
            --notes "$RELEASE_NOTES" \
            --prerelease
